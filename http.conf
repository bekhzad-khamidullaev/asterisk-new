[general]
;Plain not production version
servername=Hello friend:-)
enabled=yes
enablestatic=yes
bindaddr=127.0.0.1
bindport=8088
sessionlimit=100
session_inactivity=30000
session_keep_alive=15000
;TLS
tlsenable=yes
tlsbindaddr=127.0.0.1:8089
tlscertfile=/etc/asterisk/asterisk.pem
; tlscertfile=/etc/asterisk/keys/asterisk.cert
; tlsprivatekey=/etc/asterisk/keys/asterisk.key
tlscipher=HIGH:!aNULL:!MD5
